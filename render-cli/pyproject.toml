[project]
name = "fit-render"
version = "0.1.0"
description = "Render transparent data-overlay videos from .fit activity files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garmin-fit-sdk>=21.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=11.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
fit-render = "fit_render.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_render"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["PT018"]  # compound asserts read fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fit_render"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["garmin_fit_sdk.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: tests that invoke the ffmpeg binary (slower)"]
