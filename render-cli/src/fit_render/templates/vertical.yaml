version: 1
name: vertical
description: 9:16 phone layout with metrics grouped in the lower third.
units: metric
output: { size: vertical-1080, fps: "30", format: prores4444 }
style: { font: roboto-mono-bold, color: "#FFFFFF" }
widgets:
  - { type: metric, metric: power_to_weight, anchor: bottom-left,  offset: [0.06, 0.150], size: 0.028, smoothing_s: 3 }
  - { type: metric, metric: power_3s,        anchor: bottom-left,  offset: [0.06, 0.090], size: 0.045 }
  - { type: metric, metric: heart_rate,      anchor: bottom-right, offset: [0.06, 0.150], size: 0.028 }
  - { type: metric, metric: speed,           anchor: bottom-right, offset: [0.06, 0.090], size: 0.045 }
  - { type: metric, metric: gradient,        anchor: bottom,       offset: [0.00, 0.040], size: 0.025, smoothing_s: 5 }
