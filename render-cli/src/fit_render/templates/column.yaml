version: 1
name: column
description: Every core metric in a labelled column down the right-hand side.
units: metric
output: { size: 1080p, fps: "30", format: prores4444 }
style: { font: roboto-mono-bold, color: "#FFFFFF" }
widgets:
  - { type: metric, metric: power_3s,        label: PWR,   anchor: top-right, offset: [0.03, 0.050], size: 0.040 }
  - { type: metric, metric: power_to_weight, label: W/KG,  anchor: top-right, offset: [0.03, 0.110], size: 0.040, show_unit: false, smoothing_s: 3 }
  - { type: metric, metric: heart_rate,      label: HR,    anchor: top-right, offset: [0.03, 0.170], size: 0.040 }
  - { type: metric, metric: cadence,         label: CAD,   anchor: top-right, offset: [0.03, 0.230], size: 0.040 }
  - { type: metric, metric: speed,           label: SPD,   anchor: top-right, offset: [0.03, 0.290], size: 0.040 }
  - { type: metric, metric: gradient,        label: GRADE, anchor: top-right, offset: [0.03, 0.350], size: 0.040, smoothing_s: 5 }
  - { type: metric, metric: elevation,       label: ELEV,  anchor: top-right, offset: [0.03, 0.410], size: 0.040 }
  - { type: metric, metric: distance,        label: DIST,  anchor: top-right, offset: [0.03, 0.470], size: 0.040 }
  - { type: metric, metric: moving_time,     label: MOVE,  anchor: top-right, offset: [0.03, 0.530], size: 0.040 }
  - { type: metric, metric: total_time,      label: TIME,  anchor: top-right, offset: [0.03, 0.590], size: 0.040 }
